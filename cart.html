<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | ClothingStore</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f6f4;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            letter-spacing: 2px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 30px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .cart-items, .summary {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 100px;
            height: 110px;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-details {
            flex: 1;
        }

        .item-details h3 {
            margin-bottom: 8px;
        }

        .price {
            color: #a05252;
            font-weight: bold;
        }

        .quantity {
            margin-top: 10px;
        }

        .quantity button {
            padding: 5px 12px;
            border: 1px solid #aaa;
            background: #eee;
            cursor: pointer;
        }

        .quantity span {
            margin: 0 10px;
        }

        .remove {
            color: #d9534f;
            border: none;
            background: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .summary h2 {
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: #a05252;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .checkout-btn:hover {
            background: #783d3d;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 10px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 20px;
            background: #a05252;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
        }

        /* Order notification */

        .notification {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #218838;
            color: white;
            padding: 18px 25px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        @media(max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>ClothingStore</h2>
    <a href="{{ url_for('shop') }}">Continue Shopping</a>
</header>

<div class="container">

    <h1>My Shopping Cart 🛒</h1>

    <div class="cart-layout">

        <div class="cart-items" id="cartItems">
            <!-- Products will appear here -->
        </div>

        <div class="summary" id="cartSummary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Delivery Charges</span>
                <span id="delivery">₹50</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span id="total">₹0</span>
            </div>

            <button class="checkout-btn" onclick="placeOrder()">
                Place Order
            </button>

        </div>

    </div>
</div>

<!-- Notification message -->
<div class="notification" id="notification">
    ✓ Your order has been placed successfully!
</div>

<script>

    // Get cart products from localStorage
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function displayCart() {

        const cartItems = document.getElementById("cartItems");
        cartItems.innerHTML = "";

        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty-cart">
                    <h2>Your Cart is Empty!</h2>
                    <p>Add some beautiful outfits to your cart.</p>
                    <a href="{{ url_for('shop') }}">Shop Now</a>
                </div>
            `;

            document.getElementById("cartSummary").style.display = "none";
            return;
        }

        document.getElementById("cartSummary").style.display = "block";

        cart.forEach((item, index) => {

            cartItems.innerHTML += `
                <div class="cart-item">

                    <img src="${escapeHTML(item.image || '')}"
                         alt="${escapeHTML(item.name)}">

                    <div class="item-details">

                        <h3>${escapeHTML(item.name)}</h3>

                        <p class="price">₹${Number(item.price).toFixed(2)}</p>

                        <div class="quantity">

                            <button onclick="changeQuantity(${index}, -1)">-</button>

                            <span>${item.quantity}</span>

                            <button onclick="changeQuantity(${index}, 1)">+</button>

                        </div>

                        <button class="remove"
                                onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>

                </div>
            `;
        });

        updateTotal();
    }

    // Prevent product text from being interpreted as HTML
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    // Change product quantity
    function changeQuantity(index, change) {

        cart[index].quantity += change;

        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        }

        saveCart();
    }

    // Remove product
    function removeItem(index) {

        cart.splice(index, 1);
        saveCart();
    }

    // Calculate total price
    function updateTotal() {

        let subtotal = cart.reduce((sum, item) => {
            return sum + Number(item.price) * item.quantity;
        }, 0);

        let delivery = subtotal > 0 ? 50 : 0;

        document.getElementById("subtotal").innerText =
            "₹" + subtotal.toFixed(2);

        document.getElementById("delivery").innerText =
            "₹" + delivery.toFixed(2);

        document.getElementById("total").innerText =
            "₹" + (subtotal + delivery).toFixed(2);
    }

    function saveCart() {

        localStorage.setItem("cart", JSON.stringify(cart));
        displayCart();
    }

    // Complete order
    async function placeOrder() {

        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        const button = document.querySelector(".checkout-btn");

        button.disabled = true;
        button.innerText = "Processing...";

        try {

            // Send order to Flask backend
            const response = await fetch("/place_order", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    items: cart
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Order could not be placed.");
            }

            // Clear cart only after server confirms the order
            cart = [];
            localStorage.removeItem("cart");
            displayCart();

            // Show successful order notification
            showNotification(
                "✓ Order placed successfully! Order ID: " +
                result.order_id
            );

            // Ask permission for browser notification
            if ("Notification" in window) {

                if (Notification.permission === "granted") {

                    new Notification("ClothingStore", {
                        body: "Your clothing order has been confirmed!",
                        icon: "/static/images/logo.png"
                    });

                } else if (Notification.permission === "default") {

                    Notification.requestPermission().then(permission => {

                        if (permission === "granted") {
                            new Notification("ClothingStore", {
                                body: "Your clothing order has been confirmed!"
                            });
                        }

                    });

                }
            }

        } catch (error) {

            alert(error.message);

        } finally {

            button.disabled = false;
            button.innerText = "Place Order";

        }
    }

    // Display notification
    function showNotification(message) {

        const notification = document.getElementById("notification");

        notification.innerText = message;
        notification.style.display = "block";

        setTimeout(() => {
            notification.style.display = "none";
        }, 5000);
    }

    // Load cart when page opens
    displayCart();

</script>

</body>
</html>
